<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecipeJS - Functional Cooking Companion</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-left">
        <h1>RecipeJS</h1>
        <p class="subtitle">Functional Cooking Companion</p>
      </div>

      <div class="header-right">
        <div class="search-wrap">
          <input
            id="search-input"
            type="text"
            placeholder="Search recipes by title, ingredients, or description..."
            autocomplete="off"
          />
          <button id="clear-search" class="clear-btn hidden" type="button" aria-label="Clear search">
            ✕
          </button>
        </div>
      </div>
    </header>

    <main class="app-main">
      <section class="controls">
        <div class="filters" role="group" aria-label="Recipe filters">
          <button class="filter-btn active" data-filter="all" type="button">All</button>
          <button class="filter-btn" data-filter="vegetarian" type="button">Vegetarian</button>
          <button class="filter-btn" data-filter="vegan" type="button">Vegan</button>
          <button class="filter-btn" data-filter="quick" type="button">Quick</button>
          <button class="filter-btn" data-filter="favorites" type="button">Favorites Only</button>
        </div>

        <div class="sort">
          <label for="sort-select">Sort:</label>
          <select id="sort-select">
            <option value="title-asc">Title (A → Z)</option>
            <option value="time-asc">Time (Low → High)</option>
            <option value="difficulty-asc">Difficulty (Easy → Hard)</option>
          </select>
        </div>
      </section>

      <div id="recipe-counter" class="counter">Showing 0 of 0 recipes</div>

      <section id="recipes" class="recipes-grid" aria-live="polite"></section>
    </main>

    <footer class="app-footer">
      <small>Built with JS • Filters • Sorting • Recursion • localStorage • Debounced Search</small>
    </footer>

    <script src="./app.js"></script>
  </body>
</html>
