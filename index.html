<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RecipeJS - Functional Cooking Companion</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>RecipeJS</h1>
      <p class="subtitle">Functional Cooking Companion</p>
    </div>

    <div class="controls">
      <div class="control-group">
        <span class="label">Filter difficulty:</span>
        <div class="btn-row" id="filterRow">
          <button class="chip active" data-filter="all">All</button>
          <button class="chip" data-filter="easy">Easy</button>
          <button class="chip" data-filter="medium">Medium</button>
          <button class="chip" data-filter="hard">Hard</button>
        </div>
      </div>

      <div class="control-group">
        <label class="label" for="sortSelect">Sort by:</label>
        <select id="sortSelect" class="select">
          <option value="title-asc">Title (A → Z)</option>
          <option value="title-desc">Title (Z → A)</option>
          <option value="time-asc">Cook time (Low → High)</option>
          <option value="time-desc">Cook time (High → Low)</option>
        </select>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="meta">
      <div id="countText" class="count-text">Showing 0 of 8</div>
    </section>

    <section id="recipeContainer" class="recipe-grid" aria-label="Recipe list">
      <!-- Cards injected by JS -->
    </section>
  </main>

  <footer class="footer">
    <p>Part 3: IIFE + Recursion + Expandable Cards</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
